workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Unzip and fix versions
        script: |
          unzip -o "hello world zip.zip" || true
          rm -f "hello world zip.zip" || true
          DIR=$(find . -name "pubspec.yaml" -maxdepth 3 | head -1 | xargs dirname)
          if [ "$DIR" != "." ] && [ "$DIR" != "" ]; then cp -r $DIR/. .; fi
          sed -i '' 's/8\.10\.2/8.14.2/g' android/gradle/wrapper/gradle-wrapper.properties || sed -i 's/8\.10\.2/8.14.2/g' android/gradle/wrapper/gradle-wrapper.properties
          sed -i '' 's/8\.7\.0/8.11.1/g' android/settings.gradle.kts; sed -i '' 's/8\.7\.0/8.11.1/g' android/settings.gradle || true
          sed -i '' 's/2\.0\.0/2.2.20/g' android/build.gradle; sed -i '' 's/2\.0\.0/2.2.20/g' android/settings.gradle.kts || true
          flutter pub get
      - name: Build AAB
        script: |
          flutter build appbundle --debug --android-skip-build-dependency-validation
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
