workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Fix and Build
        script: |
          unzip -o "hello world zip.zip" || true
          rm -f "hello world zip.zip" || true
          D=$(find . -name "pubspec.yaml" -maxdepth 3 | head -1 | xargs dirname); if [ "$D" != "." ] && [ "$D" != "" ]; then cp -r $D/. .; fi
          sed -i '' 's/8\.10\.2/8.14.2/g' android/gradle/wrapper/gradle-wrapper.properties || sed -i 's/8\.10\.2/8.14.2/g' android/gradle/wrapper/gradle-wrapper.properties
          sed -i '' 's/8\.7\.0/8.11.1/g' android/settings.gradle.kts || sed -i 's/8\.7\.0/8.11.1/g' android/settings.gradle.kts; sed -i '' 's/8\.7\.0/8.11.1/g' android/settings.gradle || sed -i 's/8\.7\.0/8.11.1/g' android/settings.gradle
          sed -i '' 's/2\.0\.0/2.2.20/g' android/build.gradle || sed -i 's/2\.0\.0/2.2.20/g' android/build.gradle; sed -i '' 's/2\.0\.0/2.2.20/g' android/settings.gradle.kts || sed -i 's/2\.0\.0/2.2.20/g' android/settings.gradle.kts
          flutter pub get
          flutter build appbundle --debug --android-skip-build-dependency-validation
    artifacts:
      - build/**/outputs/**/*.aab
